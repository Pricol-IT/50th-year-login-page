<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricol | 50 Years of Excellence</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-overlay">
        <img src="background.png" alt="" class="bg-anniversary-logo">
    </div>

    <main class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <img src="50th year.svg" alt="50th Year Logo" class="anniversary-logo">
                <div class="pricol-logo-container">
                    <img src="pricol-gold-logo.png" alt="Pricol Logo" class="pricol-official-logo">
                </div>

            </div>

            <div class="auth-section">
                <button class="microsoft-btn" id="microsoftLogin">
                    <div class="ms-icon">
                        <span></span><span></span><span></span><span></span>
                    </div>
                    Sign in with Pricol ID
                </button>
            </div>


            <footer class="card-footer">
                <p class="copyright">© 2026 Pricol</p>
                <div class="footer-links">
                    <a href="#">Privacy Policy</a>
                    <span class="separator">•</span>
                    <a href="#">Support</a>
                </div>
            </footer>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
